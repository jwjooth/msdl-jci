[project]
name = "msdl-jci"
version = "0.1.0"
description = "Multi-Source Deep Learning for JCI direction prediction (thesis research, closed as rigorous negative result)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jordan Ferdinand", email = "253198146+jordan-ferdinand_IMSI@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbclient>=0.10.2",
    "numpy==2.5.3",
    "pandas>=2.2.0",
    "python-dotenv==1.2.3",
    "scikit-learn>=1.4.0",
    "torch>=2.4.0",
    "transformers>=4.41.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

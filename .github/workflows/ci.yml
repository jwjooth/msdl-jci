name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv pip install ruff mypy
      - run: uv run ruff check .
      - run: 'uv run mypy src || echo "mypy non-blocking, see docs/08_reproducibility.md"'
      - run: uv run pytest -v

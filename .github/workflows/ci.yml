name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run stats tests
        run: uv run python tests/test_stats.py

      - name: Verify notebook executes (smoke test)
        run: |
          uv run jupyter execute notebooks/development.ipynb --inplace
        env:
          TRANSFORMERS_OFFLINE: "1"
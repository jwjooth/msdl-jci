# Base configuration (frozen thesis settings). Override per-experiment under configs/experiments/.
[paths]
jci_csv = "data/raw/technical/jci_historical.csv"
bi_rate_csv = "data/raw/macro/bi_rate.csv"
inflation_csv = "data/raw/macro/inflation_data.csv"
kurs_csv = "data/raw/macro/kurs_usdidr.csv"
news_embeddings_csv = "data/processed/daily_news_embeddings.csv"
reports_dir = "reports"

[seed]
master = 42

[model]
look_back = 28
prediction_horizon = 5
lstm_hidden_dim = 64
lstm_num_layers = 2
lstm_dropout = 0.2
macro_hidden = [32, 16]
news_emb_dim = 768
news_proj_dim = 64
gating_temperature = 1.0
gating_min_weight = 0.0
modality_dropout = 0.0
entropy_lambda = 0.0
aux_lambda = 0.0

[training]
epochs = 40
batch_size = 32
lr = 0.001
weight_decay = 0.0001
patience = 10
pos_weight_from_train_only = true
loss = "bce"

[walk_forward]
train_ratio = 0.70
val_ratio = 0.10
embargo = 5
threshold_objective = "mcc"
threshold_grid = [0.20, 0.80, 0.01]

[evaluation]
metrics = ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "mcc", "roc_auc", "pr_auc", "log_loss", "brier"]

[trading]
stride = 5
fee_per_side = 0.0015
slippage_per_side = 0.0005
risk_free_annual = 0.05
long_only = true

[logging]
level = "INFO"
